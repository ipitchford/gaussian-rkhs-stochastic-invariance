target_id: gaussian-rkhs-levy-invariance-diffusion-limit
search_date: 2026-11-01
revision_date: 2026-11-04
intended_contribution_unit: theorem
claim:
  exact_statement: |
    For all d>=1, P,R positive definite, M invertible, b in R^d, and every
    infinitely divisible random vector Z with Gaussian covariance component Q,
    Tf(x)=E f(Mx+b+Z) maps the Gaussian RKHS H_P into H_R if and only if
    M R M^T <= P+4Q. In that event its norm and essential norm equal
    |det M|^(-1/2) (det P/det R)^(1/4). The jump measure is unrestricted
    except for the Levy measure condition. For dX=A X dt+dL, invariance
    of H_P at all times is equivalent to A P+P A^T <=4D, where D is the
    Brownian covariance rate of L, rather than its total covariance rate.
    For A=[[-1,5],[0,-1]], P=I, t=1/10, and f(x)=exp(-8|x|^2/5),
    symmetric coordinate compound-Poisson approximations with jumps +/-epsilon
    and individual rates 1/(2epsilon^2) have K_epsilon f outside H_I for
    every epsilon>0, although the Brownian limit has K_0 f in H_I and
    ||K_epsilon-K_0||_(H_I to C_b) is asymptotic to a positive constant
    times epsilon^2. The proved uniform bound is <0.448 epsilon^2 at t=1/10.
  exclusions:
    - No historical-priority claim for the pure Gaussian affine criterion.
    - No novelty claim for Levy-Khintchine, the OU transition exponent, or j(xi)=o(|xi|^2).
    - No novelty claim for the kernel-mean/MMD duality identity.
    - No general claim that jumps do not smooth in other function spaces.
    - No state-dependent Levy jump kernel classification. (Nonlinear Borel drift with additive state-independent noise is now covered by Theorem 9 of the revised manuscript.)
    - No comparison with total-variation convergence or RKHS operator convergence of the approximants.
source:
  originating_reference: "Extension of the Gaussian invariance question in Philipp et al. (2025), Remark 2.2(c); Levy extension is a proposed theorem, not an expressly sourced open problem."
  url: "https://arxiv.org/abs/2405.14429"
normalisation:
  indices: "Equal input and output dimension d; xi is input Fourier frequency."
  scaling: "k_P(x,y)=exp(-(x-y)^T P^-1(x-y)); Brownian covariance at time t is tD."
  basis_order: "Real Euclidean coordinates; unitary Fourier transform with (2pi)^(-d/2)."
  symmetries:
    - Common invertible real coordinate transformations.
    - Noise and deterministic translations affect phase only.
    - Orthogonal transformations of the explicit isotropic-kernel example.
