# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  verify:
    name: code/verify.py with and without -O (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check MANIFEST.sha256
        run: sha256sum -c MANIFEST.sha256
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: verify.py with and without -O (explicit checks, no assert)
        run: |
          python -I -B code/verify.py --output-dir "$RUNNER_TEMP/out"
          python -I -B -O code/verify.py --output-dir "$RUNNER_TEMP/out_O"
      - name: Compare with the shipped audit/verification_results.json (allowing last-digit float differences across platforms)
        run: |
          python -I -B - "$RUNNER_TEMP/out/verification_results.json" audit/verification_results.json <<'PY'
          import json, math, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:3])
          def cmp(x, y, path):
              if isinstance(x, dict):
                  assert_keys = set(x) == set(y)
                  if not assert_keys: sys.exit(f"keys differ at {path}")
                  for k in x:
                      if k == "environment": continue
                      cmp(x[k], y[k], path + "/" + k)
              elif isinstance(x, list):
                  if len(x) != len(y): sys.exit(f"length differs at {path}")
                  for i, (u, v) in enumerate(zip(x, y)): cmp(u, v, f"{path}[{i}]")
              elif isinstance(x, float) and isinstance(y, (int, float)):
                  if not math.isclose(x, y, rel_tol=1e-9, abs_tol=1e-12): sys.exit(f"value differs at {path}: {x} vs {y}")
              elif x != y:
                  sys.exit(f"value differs at {path}: {x!r} vs {y!r}")
          cmp(a, b, "")
          print("verification_results.json agrees with the shipped record")
          PY
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
